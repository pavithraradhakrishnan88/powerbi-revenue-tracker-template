name: DesktopValidation-PBIP

on:
  push:
    branches: [main]
    paths:
      - "template/**"
      - "data/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-and-validate.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-validate:
    runs-on: windows-latest

    env:
      TEMPLATE_ROOT: ${{ github.workspace }}\template
      DATA_ROOT: ${{ github.workspace }}\data
      OUTPUT_ROOT: ${{ github.workspace }}\generated

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore orchestrator
        shell: pwsh
        run: |
          dotnet restore src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }

      - name: Build orchestrator
        shell: pwsh
        run: |
          dotnet build src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }

      - name: Run orchestrator (generate PBIP artifacts)
        shell: pwsh
        run: |
          dotnet run --project src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj -c Release --no-build -- `
            "$env:TEMPLATE_ROOT" "$env:DATA_ROOT" "$env:OUTPUT_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Orchestrator failed with exit code $LASTEXITCODE" }

      - name: Gate — measure expression parity
        shell: pwsh
        run: .\scripts\Assert-MeasureExpressionParity.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"

      - name: Gate — PBIR page/layout contract
        shell: pwsh
        run: .\scripts\Assert-PbirPageLayoutGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"

      - name: Gate — assemble three artifacts for Desktop
        shell: pwsh
        run: |
          .\scripts\Prepare-DesktopArtifact.ps1 `
            -GeneratedRoot "$env:OUTPUT_ROOT" `
            -AssemblyRoot "$env:OUTPUT_ROOT\RevenueTracker.Desktop"

      - name: Upload assembled RevenueTracker Desktop project
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker.Desktop
          path: ${{ github.workspace }}\generated\RevenueTracker.Desktop
          include-hidden-files: true

      - name: Upload RevenueTracker.Report artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker.Report
          path: ${{ github.workspace }}\generated\RevenueTracker.Report
          include-hidden-files: true

      - name: Upload RevenueTracker.SemanticModel artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker.SemanticModel
          path: ${{ github.workspace }}\generated\RevenueTracker.SemanticModel
          include-hidden-files: true

      - name: Upload .pbip project file
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker.pbip
          path: ${{ github.workspace }}\generated\RevenueTracker.pbip

  # The three source artifacts remain available individually, while the assembled
  # Desktop artifact is the authoritative UAT package. The assembly gate verifies
  # the relative PBIP -> Report -> SemanticModel paths and the required definition.pbism.
