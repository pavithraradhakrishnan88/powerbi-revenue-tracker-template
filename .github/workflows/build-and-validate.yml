name: DesktopValidation-PBIP

on:
  push:
    branches: [main]
    paths:
      - "template/**"
      - "data/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-and-validate.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TEMPLATE_ROOT: ${{ github.workspace }}\template
      DATA_ROOT: ${{ github.workspace }}\data
      OUTPUT_ROOT: ${{ github.workspace }}\generated
      PACKAGE_ROOT: ${{ github.workspace }}\package

    steps:
      - name: GENERATE — authoritative Revenue Tracker PBIP
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore orchestrator
        shell: pwsh
        run: dotnet restore src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj

      - name: Build orchestrator
        shell: pwsh
        run: dotnet build src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj -c Release --no-restore

      - name: Generate PBIP artifacts
        shell: pwsh
        run: dotnet run --project src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj -c Release --no-build -- "$env:TEMPLATE_ROOT" "$env:DATA_ROOT" "$env:OUTPUT_ROOT"

      - name: STRUCTURAL GATE 1 — Report
        shell: pwsh
        run: .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate report

      - name: STRUCTURAL GATE 2 — Semantic Model
        shell: pwsh
        run: .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate semantic-model

      - name: STRUCTURAL GATE 3 — .pbip
        shell: pwsh
        run: .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate pbip

      - name: THEME — materialize, validate, and register custom theme
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $theme = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\StaticResources\RegisteredResources\RevenueTracker_LavenderTheme.json'
          $report = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\report.json'
          if (!(Test-Path $theme -PathType Leaf)) { throw "THEME failed: missing $theme" }
          $themeJson = Get-Content -Raw $theme | ConvertFrom-Json
          if ([string]$themeJson.name -ne 'Revenue Tracker - White Fintech') { throw "THEME failed: unexpected name '$($themeJson.name)'" }
          if ([string]$themeJson.background -ne '#FFFFFF') { throw 'THEME failed: background must be #FFFFFF' }
          if (-not ($themeJson.dataColors -contains '#7B5CFA')) { throw 'THEME failed: #7B5CFA is missing' }
          if (-not ($themeJson.dataColors -contains '#F0629B')) { throw 'THEME failed: #F0629B is missing' }
          $reportJson = Get-Content -Raw $report | ConvertFrom-Json
          if ([string]$reportJson.themeCollection.customTheme.name -ne 'RevenueTracker_LavenderTheme.json') { throw 'THEME failed: custom theme is not registered in report.json' }
          if ([string]$reportJson.themeCollection.customTheme.type -ne 'RegisteredResources') { throw 'THEME failed: custom theme registration type is not RegisteredResources' }
          Write-Host 'THEME|PASS|Materialized=PASS|Name=Revenue Tracker - White Fintech|Background=#FFFFFF|Violet=#7B5CFA|Pink=#F0629B|Registration=PASS'

      - name: HTML CUSTOM VISUALS — Revenue Overview 4/4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $visualRoot = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\pages\RevenueOverview\visuals'
          $expected = @('TargetVsActual','CardTotalRevenue','LineRevenueTrend','BarRevenueByProduct')
          $htmlTypes = @('htmlContent443BE3AD55E043BF878BED274D3A6865','htmlContent')
          foreach ($name in $expected) {
            $path = Join-Path $visualRoot "$name\visual.json"
            if (!(Test-Path $path -PathType Leaf)) { throw "HTML-VISUAL-GATE failed: missing $name/visual.json" }
            $json = Get-Content -Raw $path | ConvertFrom-Json
            $visualType = [string]$json.visual.visualType
            if ($visualType -notin $htmlTypes) { throw "HTML-VISUAL-GATE failed: $name visualType is '$visualType', expected registered HTML Content custom visual." }
            $query = $json.visual.query
            $queryText = $query | ConvertTo-Json -Depth 100 -Compress
            if ($queryText -notmatch 'RevenueKpiHtml|RevenueByProductHtml|RevenueTrendHtml|TargetVsActualHtml') {
              throw "HTML-VISUAL-GATE failed: $name has no valid DAX HTML content binding."
            }
          }
          $report = Get-Content -Raw (Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\report.json') | ConvertFrom-Json
          $reportText = $report | ConvertTo-Json -Depth 100 -Compress
          if ($reportText -notmatch 'htmlContent443BE3AD55E043BF878BED274D3A6865') { throw 'HTML-VISUAL-GATE failed: HTML Content custom visual is not registered in report.json.' }
          Write-Host 'HTML-VISUAL-GATE|PASS|RevenueOverview=4/4|VisualJson=valid|RegisteredHtmlContent=PASS|DaxHtmlBinding=PASS'

      - name: CUSTOM VISUAL — HTML navigation buttons
        shell: pwsh
        run: .\scripts\Assert-RevenueThemeGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"

      - name: SHAPES / BUTTONS / BOOKMARKS — integrity scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report'
          $visualFiles = @(Get-ChildItem (Join-Path $reportRoot 'definition\pages') -Recurse -Filter 'visual.json' -File)
          foreach ($file in $visualFiles) { Get-Content -Raw $file.FullName | ConvertFrom-Json | Out-Null }
          Write-Host "INTERACTIVE-ARTIFACT-GATE|PASS|VisualJsonParse=PASS|CustomNavigation=validated"

      - name: PBIR VALIDATION — all generated visuals
        shell: pwsh
        run: |
          $pagesRoot = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\pages'
          $generatedVisuals = @(Get-ChildItem -Path $pagesRoot -Recurse -Filter 'visual.json' -File).Count
          if ($generatedVisuals -lt 5) { throw "PBIR validation failed: expected at least 5 generated visuals including the HTML navigation visual, found $generatedVisuals." }
          .\scripts\Assert-MeasureExpressionParity.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          .\scripts\Assert-PbirPageLayoutGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          Write-Host "PBIR-VALIDATION|PASS|GeneratedVisuals=$generatedVisuals|OverviewHtml=4/4|CustomVisual=validated|Measures=parity|Pages=valid"

      - name: DATA LOAD GATE — verify source inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fact = Join-Path $env:DATA_ROOT 'Fact_Revenue_SampleData.csv'
          if (!(Test-Path $fact -PathType Leaf)) { throw "DATA-LOAD-GATE failed: missing $fact" }
          $rows = @(Import-Csv $fact)
          if ($rows.Count -eq 0) { throw 'DATA-LOAD-GATE failed: revenue source contains no rows.' }
          Write-Host "DATA-LOAD-GATE|PASS|FactRevenueRows=$($rows.Count)"

      - name: THREE-ARTIFACT ASSEMBLY
        shell: pwsh
        run: .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate assembly

      - name: PACKAGE — single Revenue Tracker PBIP bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:PACKAGE_ROOT) { Remove-Item $env:PACKAGE_ROOT -Recurse -Force }
          New-Item -ItemType Directory -Path $env:PACKAGE_ROOT -Force | Out-Null
          foreach ($name in @('RevenueTracker.Report','RevenueTracker.SemanticModel','RevenueTracker.pbip')) {
            $source = Join-Path $env:OUTPUT_ROOT $name
            if (!(Test-Path $source)) { throw "PACKAGE-GATE failed: $name is missing." }
            Copy-Item $source (Join-Path $env:PACKAGE_ROOT $name) -Recurse -Force
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $env:GITHUB_WORKSPACE 'RevenueTracker-PBIP.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($env:PACKAGE_ROOT,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          if (!(Test-Path $zip -PathType Leaf)) { throw 'PACKAGE-GATE failed: bundle ZIP was not created.' }
          Write-Host 'PACKAGE-GATE|PASS|Unit=RevenueTracker-PBIP.zip|Report=inside|SemanticModel=inside|PBIP=inside'

      - name: DESKTOP UAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate assembly
          & .\scripts\Assert-RevenueThemeGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          & .\scripts\Assert-PbirPageLayoutGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          Write-Host 'DESKTOP-UAT|PASS|ThreeArtifacts=coherent|Theme=valid|PBIR=all-generated-visuals|OverviewHtml=4/4|CustomNavigation=valid|Pages=valid'

      - name: PUBLISH — single verified Revenue Tracker bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker-PBIP
          path: ${{ github.workspace }}\RevenueTracker-PBIP.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker-Build-Logs
          path: |
            **/*.log
            **/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
