name: DesktopValidation-PBIP

on:
  push:
    branches: [main]
    paths:
      - "template/**"
      - "data/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-and-validate.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TEMPLATE_ROOT: ${{ github.workspace }}\template
      DATA_ROOT: ${{ github.workspace }}\data
      OUTPUT_ROOT: ${{ github.workspace }}\generated
      PACKAGE_ROOT: ${{ github.workspace }}\package
      PBIP_PATH: ${{ github.workspace }}\generated\RevenueTracker.pbip
      DESKTOP_DIAGNOSTICS_ROOT: ${{ github.workspace }}\generated\DesktopDiagnostics
      EXPECTED_DESKTOP_VERSION: '2.156.951.0'
      EXPECTED_DESKTOP_RELEASE: '26.07'

    steps:
      - name: GENERATE — authoritative Revenue Tracker PBIP
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore orchestrator
        shell: pwsh
        run: dotnet restore src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj

      - name: Build orchestrator
        shell: pwsh
        run: dotnet build src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj -c Release --no-restore

      - name: Generate PBIP artifacts
        shell: pwsh
        run: dotnet run --project src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj -c Release --no-build -- "$env:TEMPLATE_ROOT" "$env:DATA_ROOT" "$env:OUTPUT_ROOT"

      - name: TMDL INDENTATION GATE — generated semantic model
        shell: pwsh
        run: .\scripts\Assert-TmdlIndentation.ps1 -SemanticModelRoot (Join-Path $env:OUTPUT_ROOT 'RevenueTracker.SemanticModel')

      - name: STRUCTURAL GATES — report, semantic model, PBIP
        shell: pwsh
        run: |
          .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate report
          .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate semantic-model
          .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate pbip

      - name: THEME — materialize, validate, and register custom theme
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $theme=Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\StaticResources\RegisteredResources\RevenueTracker_LavenderTheme.json'
          $report=Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\report.json'
          if(!(Test-Path $theme -PathType Leaf)){throw "THEME failed: missing $theme"}
          $t=Get-Content -Raw $theme|ConvertFrom-Json
          if([string]$t.name -ne 'Revenue Tracker - White Fintech'){throw 'THEME failed: unexpected name'}
          if([string]$t.background -ne '#FFFFFF'){throw 'THEME failed: background must be #FFFFFF'}
          if(-not($t.dataColors -contains '#7B5CFA')){throw 'THEME failed: #7B5CFA missing'}
          if(-not($t.dataColors -contains '#F0629B')){throw 'THEME failed: #F0629B missing'}
          $r=Get-Content -Raw $report|ConvertFrom-Json
          if([string]$r.themeCollection.customTheme.name -ne 'RevenueTracker_LavenderTheme.json'){throw 'THEME failed: custom theme not registered'}
          if([string]$r.themeCollection.customTheme.type -ne 'RegisteredResources'){throw 'THEME failed: registration type'}
          Write-Host 'THEME|PASS|Materialized=PASS|Registration=PASS'

      - name: HTML CUSTOM VISUALS — Revenue Overview 4/4
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\pages\RevenueOverview\visuals'
          $expected=@('TargetVsActual','CardTotalRevenue','LineRevenueTrend','BarRevenueByProduct')
          $types=@('htmlContent443BE3AD55E043BF878BED274D3A6865','htmlContent')
          foreach($name in $expected){
            $p=Join-Path $root "$name\visual.json"
            if(!(Test-Path $p -PathType Leaf)){throw "HTML-VISUAL-GATE failed: missing $name"}
            $j=Get-Content -Raw $p|ConvertFrom-Json
            if([string]$j.visual.visualType -notin $types){throw "HTML-VISUAL-GATE failed: $name is not HTML Content"}
            $q=$j.visual.query|ConvertTo-Json -Depth 100 -Compress
            if($q -notmatch 'RevenueKpiHtml|RevenueByProductHtml|RevenueTrendHtml|TargetVsActualHtml'){throw "HTML-VISUAL-GATE failed: $name has no valid DAX HTML binding"}
          }
          Write-Host 'HTML-VISUAL-GATE|PASS|RevenueOverview=4/4|DaxHtmlBinding=PASS'

      - name: CUSTOM VISUAL — HTML navigation buttons
        shell: pwsh
        run: .\scripts\Assert-RevenueThemeGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"

      - name: SHAPES / BUTTONS / BOOKMARKS — integrity scan
        shell: pwsh
        run: |
          $files=@(Get-ChildItem (Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\pages') -Recurse -Filter 'visual.json' -File)
          foreach($f in $files){Get-Content -Raw $f.FullName|ConvertFrom-Json|Out-Null}
          Write-Host "INTERACTIVE-ARTIFACT-GATE|PASS|VisualJsonParse=PASS|Visuals=$($files.Count)"

      - name: PBIR VALIDATION — all generated visuals
        shell: pwsh
        run: |
          $pages=Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\pages'
          $count=@(Get-ChildItem $pages -Recurse -Filter 'visual.json' -File).Count
          if($count -lt 5){throw "PBIR validation failed: expected at least 5 generated visuals, found $count"}
          .\scripts\Assert-MeasureExpressionParity.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          .\scripts\Assert-PbirPageLayoutGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          Write-Host "PBIR-VALIDATION|PASS|GeneratedVisuals=$count|Measures=parity|Pages=valid"

      - name: DATA LOAD GATE — verify source inputs
        shell: pwsh
        run: |
          $fact=Join-Path $env:DATA_ROOT 'Fact_Revenue_SampleData.csv'
          if(!(Test-Path $fact -PathType Leaf)){throw "DATA-LOAD-GATE failed: missing $fact"}
          $rows=@(Import-Csv $fact)
          if($rows.Count -eq 0){throw 'DATA-LOAD-GATE failed: revenue source contains no rows'}
          Write-Host "DATA-LOAD-GATE|PASS|FactRevenueRows=$($rows.Count)"

      - name: THREE-ARTIFACT ASSEMBLY
        shell: pwsh
        run: .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate assembly

      - name: PACKAGE — single Revenue Tracker PBIP bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path $env:PACKAGE_ROOT){Remove-Item $env:PACKAGE_ROOT -Recurse -Force}
          New-Item -ItemType Directory -Path $env:PACKAGE_ROOT -Force|Out-Null
          foreach($name in @('RevenueTracker.Report','RevenueTracker.SemanticModel','RevenueTracker.pbip')){
            $source=Join-Path $env:OUTPUT_ROOT $name
            if(!(Test-Path $source)){throw "PACKAGE-GATE failed: $name missing"}
            Copy-Item $source (Join-Path $env:PACKAGE_ROOT $name) -Recurse -Force
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Join-Path $env:GITHUB_WORKSPACE 'RevenueTracker-PBIP.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          [IO.Compression.ZipFile]::CreateFromDirectory($env:PACKAGE_ROOT,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          if(!(Test-Path $zip -PathType Leaf)){throw 'PACKAGE-GATE failed: ZIP not created'}
          Write-Host 'PACKAGE-GATE|PASS|Unit=RevenueTracker-PBIP.zip'

      - name: DESKTOP ENVIRONMENT PREREQUISITE — detect/install exact July 2026 Desktop
        shell: pwsh
        run: .\scripts\Install-VerifiedPowerBiDesktopJuly2026.ps1 -ExpectedVersion "$env:EXPECTED_DESKTOP_VERSION" -ExpectedRelease "$env:EXPECTED_DESKTOP_RELEASE" -DiagnosticsRoot "$env:DESKTOP_DIAGNOSTICS_ROOT"

      - name: VERIFY — 2.156.951.0 (26.07)
        shell: pwsh
        run: |
          $i=Get-Content -Raw (Join-Path $env:DESKTOP_DIAGNOSTICS_ROOT 'desktop-environment.json')|ConvertFrom-Json
          if($i.ProductVersion -ne $env:EXPECTED_DESKTOP_VERSION){throw "DESKTOP-VERSION-VERIFY failed: expected $env:EXPECTED_DESKTOP_VERSION, found $($i.ProductVersion)"}
          Write-Host "DESKTOP-VERSION-VERIFY|PASS|ProductVersion=$($i.ProductVersion)|Release=$env:EXPECTED_DESKTOP_RELEASE"

      - name: REAL DESKTOP / BRIDGE LAUNCH + PBIP LOAD + DIAGNOSTICS
        shell: pwsh
        run: .\scripts\Invoke-RealDesktopUat.ps1 -PbipPath "$env:PBIP_PATH" -ExpectedVersion "$env:EXPECTED_DESKTOP_VERSION" -DiagnosticsRoot "$env:DESKTOP_DIAGNOSTICS_ROOT"

      - name: DESKTOP UAT
        shell: pwsh
        run: |
          $uat=Join-Path $env:DESKTOP_DIAGNOSTICS_ROOT 'desktop-uat.json'
          if(!(Test-Path $uat -PathType Leaf)){throw 'DESKTOP-UAT failed: real Desktop UAT result is missing'}
          $r=Get-Content -Raw $uat|ConvertFrom-Json
          if($r.ProductVersion -ne $env:EXPECTED_DESKTOP_VERSION){throw 'DESKTOP-UAT failed: version prerequisite not satisfied'}
          if($r.BridgeOpen -ne $true -or $r.BridgeStatus -ne $true -or $r.PbipLoad -ne $true -or $r.DiagnosticsCaptured -ne $true){throw 'DESKTOP-UAT failed: real Desktop/Bridge load and diagnostics incomplete'}
          Write-Host "DESKTOP-UAT|PASS|Version=$($r.ProductVersion)|BridgeOpen=PASS|BridgeStatus=PASS|PBIPLoad=PASS|Diagnostics=PASS"

      - name: PUBLISH — single verified Revenue Tracker bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker-PBIP
          path: ${{ github.workspace }}\RevenueTracker-PBIP.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker-Build-Logs
          path: |
            **/*.log
            **/TestResults/**
            generated/DesktopDiagnostics/**
          if-no-files-found: ignore
          retention-days: 7
