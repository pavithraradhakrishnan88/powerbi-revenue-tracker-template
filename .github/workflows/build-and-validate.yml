name: DesktopValidation-PBIP

on:
  push:
    branches: [main]
    paths:
      - "template/**"
      - "data/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-and-validate.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TEMPLATE_ROOT: ${{ github.workspace }}\template
      DATA_ROOT: ${{ github.workspace }}\data
      OUTPUT_ROOT: ${{ github.workspace }}\generated
      PACKAGE_ROOT: ${{ github.workspace }}\package

    steps:
      - name: GENERATE — authoritative Revenue Tracker PBIP
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore orchestrator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }

      - name: Build orchestrator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }

      - name: Generate PBIP artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project src/RevenueTemplateOrchestrator/RevenueTemplateOrchestrator.csproj -c Release --no-build -- `
            "$env:TEMPLATE_ROOT" "$env:DATA_ROOT" "$env:OUTPUT_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Orchestrator failed with exit code $LASTEXITCODE" }

      - name: STRUCTURAL GATE 1 — Report
        shell: pwsh
        run: .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate report

      - name: STRUCTURAL GATE 2 — Semantic Model
        shell: pwsh
        run: .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate semantic-model

      - name: STRUCTURAL GATE 3 — .pbip
        shell: pwsh
        run: .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate pbip

      - name: THEME — materialize, validate, and register custom theme
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $theme = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\StaticResources\RegisteredResources\RevenueTracker_LavenderTheme.json'
          $report = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\report.json'
          if (!(Test-Path $theme -PathType Leaf)) { throw "THEME failed: missing $theme" }
          $themeJson = Get-Content -Raw $theme | ConvertFrom-Json
          if ([string]$themeJson.name -ne 'Revenue Tracker - White Fintech') { throw "THEME failed: unexpected name '$($themeJson.name)'" }
          if ([string]$themeJson.background -ne '#FFFFFF') { throw 'THEME failed: background must be #FFFFFF' }
          if (-not ($themeJson.dataColors -contains '#7B5CFA')) { throw 'THEME failed: #7B5CFA is missing' }
          if (-not ($themeJson.dataColors -contains '#F0629B')) { throw 'THEME failed: #F0629B is missing' }
          $reportJson = Get-Content -Raw $report | ConvertFrom-Json
          if ([string]$reportJson.themeCollection.customTheme.name -ne 'RevenueTracker_LavenderTheme.json') { throw 'THEME failed: custom theme is not registered in report.json' }
          if ([string]$reportJson.themeCollection.customTheme.type -ne 'RegisteredResources') { throw 'THEME failed: custom theme registration type is not RegisteredResources' }
          $registered = @($reportJson.resourcePackages | Where-Object { $_.name -eq 'RegisteredResources' })
          if ($registered.Count -ne 1) { throw 'THEME failed: exactly one RegisteredResources package is required' }
          $item = @($registered[0].items | Where-Object { $_.name -eq 'RevenueTracker_LavenderTheme.json' })
          if ($item.Count -ne 1 -or [string]$item[0].type -ne 'CustomTheme' -or [string]$item[0].path -ne 'RevenueTracker_LavenderTheme.json') { throw 'THEME failed: RegisteredResources item is invalid' }
          Write-Host 'THEME|PASS|Materialized=PASS|Name=Revenue Tracker - White Fintech|Background=#FFFFFF|Violet=#7B5CFA|Pink=#F0629B|Registration=PASS'

      - name: NATIVE VISUAL FORMATTING — 4 visuals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $visualRoot = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\pages\RevenueOverview\visuals'
          $expected = @{
            'TargetVsActual' = 'clusteredColumnChart'
            'CardTotalRevenue' = 'card'
            'LineRevenueTrend' = 'lineChart'
            'BarRevenueByProduct' = 'barChart'
          }
          foreach ($name in $expected.Keys) {
            $path = Join-Path $visualRoot "$name\visual.json"
            if (!(Test-Path $path -PathType Leaf)) { throw "NATIVE-VISUAL-GATE failed: missing $name/visual.json" }
            $json = Get-Content -Raw $path | ConvertFrom-Json
            if ([string]$json.visual.visualType -ne $expected[$name]) { throw "NATIVE-VISUAL-GATE failed: $name visualType is '$($json.visual.visualType)', expected '$($expected[$name])'" }
          }
          Write-Host 'NATIVE-VISUAL-GATE|PASS|Visuals=4/4|Types=validated'

      - name: SHAPES / BUTTONS / BOOKMARKS — integrity scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report'
          $visualFiles = @(Get-ChildItem (Join-Path $reportRoot 'definition\pages') -Recurse -Filter 'visual.json' -File)
          foreach ($file in $visualFiles) { Get-Content -Raw $file.FullName | ConvertFrom-Json | Out-Null }
          $bookmarkFiles = @(Get-ChildItem $reportRoot -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'bookmark' })
          $shapeVisuals = @($visualFiles | Where-Object { (Get-Content -Raw $_.FullName) -match 'shape' })
          $buttonVisuals = @($visualFiles | Where-Object { (Get-Content -Raw $_.FullName) -match 'button' })
          Write-Host "INTERACTIVE-ARTIFACT-GATE|PASS|Shapes=$($shapeVisuals.Count)|Buttons=$($buttonVisuals.Count)|Bookmarks=$($bookmarkFiles.Count)|VisualJsonParse=PASS"

      - name: 4/4 VISUAL + PBIR VALIDATION
        shell: pwsh
        run: |
          $pagesRoot = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\pages'
          $generatedVisuals = @(Get-ChildItem -Path $pagesRoot -Recurse -Filter 'visual.json' -File).Count
          if ($generatedVisuals -lt 4) { throw "PBIR validation failed: expected at least 4 generated visuals, found $generatedVisuals." }
          .\scripts\Assert-RevenueThemeGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          .\scripts\Assert-MeasureExpressionParity.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          .\scripts\Assert-PbirPageLayoutGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          Write-Host "PBIR-VALIDATION|PASS|GeneratedVisuals=$generatedVisuals|AllVisuals=validated|Measures=parity|Pages=valid"

      - name: DATA LOAD GATE — verify source inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fact = Join-Path $env:DATA_ROOT 'Fact_Revenue_SampleData.csv'
          if (!(Test-Path $fact -PathType Leaf)) { throw "DATA-LOAD-GATE failed: missing $fact" }
          $rows = @(Import-Csv $fact)
          if ($rows.Count -eq 0) { throw 'DATA-LOAD-GATE failed: revenue source contains no rows.' }
          Write-Host "DATA-LOAD-GATE|PASS|FactRevenueRows=$($rows.Count)"

      - name: THREE-ARTIFACT ASSEMBLY
        shell: pwsh
        run: .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate assembly

      - name: PACKAGE — single Revenue Tracker PBIP bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:PACKAGE_ROOT) { Remove-Item $env:PACKAGE_ROOT -Recurse -Force }
          New-Item -ItemType Directory -Path $env:PACKAGE_ROOT -Force | Out-Null
          foreach ($name in @('RevenueTracker.Report','RevenueTracker.SemanticModel','RevenueTracker.pbip')) {
            $source = Join-Path $env:OUTPUT_ROOT $name
            if (!(Test-Path $source)) { throw "PACKAGE-GATE failed: $name is missing." }
            Copy-Item $source (Join-Path $env:PACKAGE_ROOT $name) -Recurse -Force
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $env:GITHUB_WORKSPACE 'RevenueTracker-PBIP.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($env:PACKAGE_ROOT,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          if (!(Test-Path $zip -PathType Leaf)) { throw 'PACKAGE-GATE failed: bundle ZIP was not created.' }
          $verifyRoot = Join-Path $env:GITHUB_WORKSPACE 'package-verify'
          if (Test-Path $verifyRoot) { Remove-Item $verifyRoot -Recurse -Force }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $verifyRoot)
          foreach ($name in @('RevenueTracker.Report','RevenueTracker.SemanticModel','RevenueTracker.pbip')) {
            if (!(Test-Path (Join-Path $verifyRoot $name))) { throw "PACKAGE-GATE failed: $name is missing from ZIP." }
          }
          $generatedVersion = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\definition\version.json'
          $packagedVersion = Join-Path $verifyRoot 'RevenueTracker.Report\definition\version.json'
          if (!(Test-Path $generatedVersion -PathType Leaf)) { throw 'PACKAGE-GATE failed: generated definition/version.json is missing.' }
          if (!(Test-Path $packagedVersion -PathType Leaf)) { throw 'PACKAGE-GATE failed: definition/version.json was lost during assembly.' }
          $generatedVersionJson = Get-Content -Raw $generatedVersion | ConvertFrom-Json
          $packagedVersionJson = Get-Content -Raw $packagedVersion | ConvertFrom-Json
          if ([string]$generatedVersionJson.version -ne [string]$packagedVersionJson.version) { throw 'PACKAGE-GATE failed: definition/version.json changed during assembly.' }
          if ([string]$generatedVersionJson.version -ne '2.0.0') { throw 'PACKAGE-GATE failed: definition/version.json must declare PBIR version 2.0.0.' }
          $generatedTheme = Join-Path $env:OUTPUT_ROOT 'RevenueTracker.Report\StaticResources\RegisteredResources\RevenueTracker_LavenderTheme.json'
          $packagedTheme = Join-Path $verifyRoot 'RevenueTracker.Report\StaticResources\RegisteredResources\RevenueTracker_LavenderTheme.json'
          if (!(Test-Path $generatedTheme -PathType Leaf)) { throw 'PACKAGE-GATE failed: generated custom theme is missing.' }
          if (!(Test-Path $packagedTheme -PathType Leaf)) { throw 'PACKAGE-GATE failed: custom theme was lost during assembly.' }
          Write-Host 'PACKAGE-GATE|PASS|Unit=RevenueTracker-PBIP.zip|Report=inside|SemanticModel=inside|PBIP=inside|Theme=inside|Version=2.0.0'

      - name: DESKTOP UAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Assert-ThreeArtifactStructure.ps1 -GeneratedRoot "$env:OUTPUT_ROOT" -Gate assembly
          & .\scripts\Assert-RevenueThemeGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          & .\scripts\Assert-PbirPageLayoutGate.ps1 -GeneratedRoot "$env:OUTPUT_ROOT"
          Write-Host 'DESKTOP-UAT|PASS|ThreeArtifacts=coherent|Theme=valid|PBIR=all-generated-visuals|Pages=valid|VersionJson=2.0.0'
          Write-Host 'NOTE|Executable Power BI Desktop launch remains a runner-specific UAT and is not claimed by this static gate.'

      - name: PUBLISH — single verified Revenue Tracker bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker-PBIP
          path: ${{ github.workspace }}\RevenueTracker-PBIP.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RevenueTracker-Build-Logs
          path: |
            **/*.log
            **/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
